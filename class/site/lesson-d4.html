/* Theme overrides. Higher specificity than :root, so an explicit choice always
   beats the prefers-color-scheme default. data-theme absent = follow the OS. */
html[data-theme="light"]{color-scheme:light;
 --bg:#fbfaf8;--fg:#1d1b19;--mut:#6b6560;--line:#d6d0c7;--acc:#b4531f;--card:#fff;
 --ok:#1f7a4d;--okbg:#eef7f1;--bad:#b03024;--badbg:#fbeeec;--warn:#8a6d1f;--warnbg:#fdf6e3;--dia:#f4f1ec}
html[data-theme="dark"]{color-scheme:dark;
 --bg:#16151a;--fg:#e8e5e0;--mut:#9c9aa2;--line:#4a4750;--acc:#e08a5a;--card:#1d1c22;
 --ok:#6dd39b;--okbg:#12251b;--bad:#f08a80;--badbg:#2a1614;--warn:#e0c07a;--warnbg:#25200f;--dia:#1a191f}
#themebtn{font:inherit;font-size:12.5px;line-height:1;background:var(--card);color:var(--fg);
 border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
#themebtn:hover{color:var(--acc);border-color:var(--acc)}
header.top #themebtn{margin-left:10px;align-self:center;margin-bottom:3px}
.themetop{display:flex;justify-content:flex-end;margin:0 0 6px}

<script>
(function(){
  var KEY='ccaf.theme', modes=['auto','light','dark'], labels={auto:'Auto',light:'Daylight',dark:'Night'};
  var cur='auto';
  try{ var v=localStorage.getItem(KEY); if(v && modes.indexOf(v)>=0) cur=v; }catch(e){}
  function apply(m){
    if(m==='auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',m);
    var b=document.getElementById('themebtn');
    if(b){ b.textContent='Theme: '+labels[m]; b.title='Theme: '+labels[m]+' — click for '+
      labels[modes[(modes.indexOf(m)+1)%modes.length]]; }
  }
  function init(){
    if(document.getElementById('themebtn')) return;
    var b=document.createElement('button');
    b.id='themebtn'; b.type='button';
    b.addEventListener('click',function(){
      cur=modes[(modes.indexOf(cur)+1)%modes.length];
      try{ localStorage.setItem(KEY,cur); }catch(e){}
      apply(cur);
    });
    // top-right of the page: inside the sticky header where there is one,
    // otherwise a right-aligned strip at the top of the content column
    var head=document.querySelector('header.top .row'), main=document.querySelector('main');
    if(head) head.appendChild(b);
    else if(main){ var w=document.createElement('div'); w.className='themetop'; w.appendChild(b); main.insertBefore(w, main.firstChild); }
    else { b.style.position='fixed'; b.style.top='12px'; b.style.right='16px'; b.style.zIndex='60'; document.body.appendChild(b); }
    apply(cur);
  }
  apply(cur);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script></body></html>
